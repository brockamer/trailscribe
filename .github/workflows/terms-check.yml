name: Terms check

# Private-terms check (stand-alone design: one workflow, one script). It compares text that the logins in the repository
# variable TERMS_CHECK_LOGINS publish here with a private list held in the `private-terms` environment, and reports one line:
# `private-terms: pass` or `private-terms: stop`. The script is .github/terms-check/check.py; read its header before editing.
#
# Secrets. PRIVATE_TERMS and PRIVATE_TERMS_ALLOW are each ONE base64 line, so the runner's log masking (whole secret, each line,
# any substring) cannot turn a term found in other log text into "***". Upload from the host with:
#   base64 -w0 private-terms.txt | gh secret set PRIVATE_TERMS --env private-terms --repo <owner>/<repo>
#   base64 -w0 allow.txt        | gh secret set PRIVATE_TERMS_ALLOW --env private-terms --repo <owner>/<repo>
# NTFY_TOPIC is a plain secret. TERMS_CHECK_LOGINS is a repository variable (comma or space separated), so it is not masked.
#
# Rules this file must keep, because the public log is public:
# - The job is named `private-terms`. The branch rule on main requires that exact name.
# - Never put event text (anything under the github event context) in run:, env: or with:. Actions prints a step's expanded
#   env in the log and only secrets are masked. The script reads the event file the runner already provides.
# - Never check out or run a pull request's head. The checkout below takes the default ref only.
# - Which file runs: issues, issue_comment, pull_request_target and schedule always run the default branch's copy of this file.
#   workflow_dispatch runs the copy on whichever branch it is started from, so only the environment's rule (selected branches:
#   main) keeps a branch's copy away from the secrets. That rule is part of the design, not an extra.
# - Actions are pinned to a full commit; update the comment beside the commit with its release.

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  schedule:
    - cron: "17 * * * *" # hourly sweep, looks back 26 hours
  workflow_dispatch:

run-name: private-terms

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  private-terms:
    runs-on: ubuntu-latest
    environment: private-terms
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/terms-check
          persist-credentials: false

      - name: Check
        run: python3 .github/terms-check/check.py
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          PRIVATE_TERMS_ALLOW: ${{ secrets.PRIVATE_TERMS_ALLOW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERMS_CHECK_LOGINS: ${{ vars.TERMS_CHECK_LOGINS }}
